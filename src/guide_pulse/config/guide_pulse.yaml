# ============================================================================
# guide_bridge 节点部署配置
# 参数默认值的唯一源 = mqtt_guide_bridge_node.cpp 的 declare_parameter，
# 本文件只写两类内容：
#   1) 部署环境配置（地址/凭据/路径，按环境必须覆盖）
#   2) 现场常调项（内容类/校准类，改完重启生效）
# 未列出的参数一律用代码默认值；需要覆盖时在此追加同名条目即可
# ============================================================================
guide_bridge:
  ros__parameters:
    # ---- 部署环境 ----
    #broker_uri: "tcp://124.223.200.153:12883"
    #enroll_origin: "http://124.223.200.153:8780"
    broker_uri: "tcp://43.161.197.161:12883"
    enroll_origin: "http://43.161.197.161:8780"
    serial_number: ""                    # 留空自动获取（环境变量 > 本地文件）
    serial_number_file: "/robot/info/sn"
    display_remote_host: "10.1.1.100"    # 运控板（屏幕显示/SSH 回查共用）
    display_remote_user: "run"
    display_remote_pass: "1"             # scp/SSH 密码；空=禁用屏幕显示

    # ---- 现场常调项 ----
    # 二维码业务互斥窗口秒数（2026-10-17 现场需求：显示与取消二维码显示
    # 是两个业务，与其他业务互斥，超时 20s；只管互斥占用，二维码常驻
    # 时长仍由 display_show_timeout_seconds 独立计时默认 120s=2 分钟，
    # 2026-10-22 现场需求全流程统一；切换场景各业务入口先撤屏不等超时）
    qr_business_timeout_seconds: 20
    # 取消二维码（撤屏恢复默认表情）的 PlayEmotion 优先级
    #（2026-10-23 真机故障修复：打断语义 = 高优先级打断低优先级，二维码
    # 以 priority=0 上屏，取消同为 0 时运控板受理 ok 但不打断循环视频，
    # 触发车型导览后二维码滞留屏幕即此因；须保持大于 0。取消失败每 5s
    # 自动重试，无需人工干预）
    display_restore_priority: 1
    # 真机航点导航：对接 t1_slam_nav_ws 的 /liwei_navigation/navigate
    # action（navigate=go / relocate=set_pose；接口文档见 t1_slam_nav_ws/
    # docs/NavigateAction.md）
    nav_executor: "waypoint"
    mock_nav_seconds: 0                  # mock 导航模拟耗时秒
    # 导航在途兜底超时秒（默认 600）：navigate goal 受理后 result 终态
    # 断流/导航栈卡死时，到期按 failed:navigation_failed 收尾并释放
    # 导览业务——等待期所有新业务被拒（failed/busy），超时过长现场感受
    # 就是「一直拒绝」。按场地最大行程时长配置（展厅通常几十秒）
    nav_timeout_seconds: 600
    # 重定位（relocate）等待导航模块验收的超时秒（2026-10-17：终态 =
    # set_pose goal 的 result（服务端发初值并验收完才回），正常 ~1.5s 出
    # 结果，此值为 result 丢失/服务卡死的兜底；超时按
    # failed/localization_failed 收尾）
    relocate_timeout_seconds: 30
    # 变形后重定位发送前等待秒（2026-10-21 现场需求）：变形动作落位后
    # 机器人还有余晃，立即发 set_pose 重设初值会被余晃期抖动干扰，先等
    # 这么多秒再发；0 = 原行为（落位即发）
    relocate_after_transform_delay_seconds: 2
    # 业务互斥拒绝时的语音提示（重定位/导航在途播——机器人没在说话；
    # 迎宾/播报/讲解中正在出声不播；空串 = 禁用）
    busy_hint_relocate_text: "我正在重定位，请稍后"
    busy_hint_navigate_text: "我正在导航，请稍后"
    # 导航/重定位失败时的语音提示（2026-10-17 现场需求：导航栈异常
    #（服务不可用/超时/验收失败）现场要能听到，提示排查 navigation
    # service）；回执照发，播报属本地增强；空串 = 禁用
    navigate_failed_text: "导航失败，请检查navigation service是否正常"
    # 导航被拒（航点表无该点位）时的语音提示（2026-10-19 现场需求：
    # goal 被 t1_slam_nav_ws 拒绝——「路线里没有叫 X 的航点」属点位未
    # 配置而非导航栈异常（如语料配了 F 点而路线只有 Y/J/A/E/H/K），
    # 播报指引配置点位而不是排查服务；回执照发，播报属本地增强；
    # 空串 = 禁用播报
    navigate_waypoint_missing_text: "还未设置该点位信息哦，请设置相应点位后再次尝试"
    relocate_failed_text: "重定位失败，请检查navigation service是否正常"
    # 变形未确认双足即拒绝下发导航/重定位的提示（2026-10-18 现场需求：
    # 一定是双足形态确认后才向 t1_slam_nav_ws 发导航指令；运控不可用/
    # 变形被拒/动作未到位时拒绝并播此提示；回执 failed/transform_failed，
    # 播报属本地增强；空串 = 禁用播报）
    navigate_transform_failed_text: "变形未完成，暂时无法导航，请检查机器人姿态"
    # 导览受理成功后的引导语（2026-10-17 现场需求：确认 [导航] 收到
    # 应答 accepted=true 后播报；{point} 替换点位显示名=映射表 name，
    # 如「比亚迪 M9 DM-i」；空串 = 禁用。2026-10-21 现场需求：仅 App
    # MQTT 下发的导航播，语料触发不播——agent 已说过带顾客过去的话术，
    # 再说就重复）
    navigate_lead_text: "请跟我来，让我带您去看看{point}这款车"
    # 导航目标为迎宾点时的引导语（2026-10-19 现场需求）：App 下发
    # navigate 去迎宾点（如 Y），上面的普通引导语会播成「请跟我来…
    # 去看看迎宾点这款车」语义不通（迎宾点不是车型），改播这句（原与
    # welcome_prep 触发语料同款，2026-10-21 语料改「整装待发，即刻
    # 就位」后不同款）。判定：code 命中 welcome_point_code
    # 或点位显示名含「迎宾」两字。空串 = 回退普通引导语
    navigate_lead_welcome_text: "好嘞，马上前去迎宾点"
    # 导航出发播报语（2026-10-18 现场需求）：收到导航指令（无论语音还是
    # MQTT）受理后先播这句再起身变形人形（先开口、立刻动）；迎宾准备去
    # Y 点的导航不播（agent 已说「整装待发，即刻就位」，再说就重复了）。
    # 空串 = 禁用
    navigate_depart_text: "稍等，马上出发"
    # 重定位出发播报语（2026-10-18 现场需求）：仅 MQTT 下行的 relocate 先
    # 播这句再起身变形人形（set_pose 有双足站立硬约束）；语料触发不播
    #（agent 已说「好的，这就在A点开始重定位」）。空串 = 禁用
    relocate_depart_text: "马上开始重定位，请稍后"
    # 途中播报固定首句（2026-10-21 现场需求）：受理引导语播完、第一次
    # 到播报点先播这句固定清道话术（起步时请围观路人让行），播完回到
    # 随机池；空串 = 不固定、从第一句起就随机
    navigate_chatter_first_text: "小T要出发啦，麻烦大家给我让点空间吧"
    # 去迎宾点专用固定首句（赶路清道口径）；空串 = 不固定
    navigate_chatter_welcome_first_text: "大家让一让，小T赶时间去迎宾点啦"
    # 导航途中随机播报语料池（2026-10-21 现场需求）：受理引导语播完后，
    # 每句播完静默 N 秒（见 navigate_chatter_silence_seconds）随机挑一句
    # 播报（随机取、不与上一条连续重复），
    # 安抚顾客「不要着急、跟我走」；到达/取消/失败即停。现场可直接
    # 改写/增删条目；注意不要写成空列表（Humble rcl yaml 不支持 `: []`，
    # 需禁用请删条目留空）。2026-10-22 现场需求：清道话术「小T正在
    # 赶路，麻烦大家给我让点空间吧」入池——固定首句播完后途中也要
    # 轮播到这句
    navigate_chatter_texts:
      - "请不用着急，跟着我慢慢走哦"
      - "马上就到了，请跟紧我"
      - "请注意脚下，跟我来"
      - "别着急，我们很快就到啦"
      - "小T正在赶路，麻烦大家给我让点空间吧"
    # 去迎宾点专用池（2026-10-21 现场需求：去迎宾点途中没有顾客跟走，
    # 「请跟我走」话术不对，改播赶路/就位类的话；迎宾准备（语料触发）
    # 与 App 下发 navigate 去迎宾点共用；空 = 去迎宾点途中不播）
    navigate_chatter_welcome_texts:
      - "我正赶往迎宾点，马上就到啦"
      - "请大家稍稍让一让，我赶时间去迎宾点哦"
      - "小T正在赶路，马上就到迎宾点啦"
    # 一句播完到下一句的静默秒数（两池共用，2026-10-21 现场需求：间隔
    # 指两句之间的静默、不含 TTS 播报本身的时间；下一句时刻自动按
    # 本句字数估算播报时长 + 此静默值排定，无需手工把播报时长加进去）
    navigate_chatter_silence_seconds: 5
    # 迎宾引导语（2026-10-17 现场需求：迎宾先播引导语，播完（TtsStatus
    # 终态回流/字数估算兜底）再变形，变形完成播迎宾词；空串 = 禁用
    #（直接变形，回退原时序））
    welcome_lead_text: "哈喽哈喽！电池满格，热情也满格"
    # 迎宾准备就位播报语（2026-10-18 现场需求：语料触发导航去迎宾点，
    # 到达变形四足、摄像头收平后最后播报；空串 = 禁用）
    welcome_prep_done_text: "元气满满，做好准备迎接顾客"
    # 送客到达播报语（2026-10-21 现场需求：语料触发送顾客回迎宾点，
    # 到达变形四足、摄像头收平后最后播报的感谢语；空串 = 禁用）
    send_off_done_text: "欢乐的时光过的特别快，又到时间讲拜拜！祝您一路绿灯、续航永不掉线，希望有我的陪伴，能给你带去满满的小惊喜，您可以扫码收下我们的选车小资料，方便您回去再慢慢对比，如果有需要可以随时和我们联系。"
    # 迎宾准备到达后延迟变形秒数（2026-10-18 测试需求）：到达 Y 点收到
    # 导航 result 后不立即变形，等这么多秒再变四足；0 = 原行为（到达即变形）
    welcome_prep_transform_delay_seconds: 5
    # 点位映射表+播放词表落盘文件（v0.25.0 P-039 point_map 全量替换 +
    # v0.28.0 P-042 播放词 text）：App 每次推表整表覆盖此文件（点位映射
    # 与播放词同表一起落盘），重启自动加载（App 无需重推）。放平台持久
    # 化数据分区 /robot/persist/var/guide_pulse/（ext4 数据分区，机器人
    # 断电数据也在；与其他模块 var 数据同级，代码默认值一致，此处显式
    # 写出便于现场排查）
    point_map_file: "/robot/persist/var/guide_pulse/point_map.json"
    # navigate 到达而映射表为空时的提示话术（播报给现场 + 回执
    # navigate.result/failed:point_not_found，不启动导航）
    point_map_missing_text: "无法执行导览工作，请配置点位映射表哦"
    # 表空或点位名未命中时的拒绝话术，navigate/relocate 共用
    #（{point} 替换原始点位名；回执同 failed:point_not_found。
    # 2026-10-17 现场需求：映射表是唯一权威，未命中直接拒绝，
    # 不再原样透传航点名；空串 = 禁用播报）
    point_map_unmatched_text: "未找到点位{point}，请重新配置映射表"
    # MQTT scene=welcome 三场景路由（2026-10-22 现场需求）：后端下发
    # texts 为三选一标记词「准备迎宾」「开始迎宾」「欢送顾客」时分别
    # 触发 迎宾准备（导航去迎宾点，到达变四足播就位语）/ 原迎宾流程
    # （迎宾词走映射表）/ 送客（到达播感谢语）——标记词内置匹配无需
    # 配置，且不作 TTS 播报内容；下列语料是语音触发面 + MQTT 完整话术
    # 形态的补充指令词（改一处双面生效）
    welcome_point_code: "Y"
    agent_monitor.welcome_phrases:       # agent 话术命中任一条 -> 迎宾（空=关闭）
      - "恭候光临，倒屣相迎"
    agent_monitor.welcome_prep_phrases:  # agent 话术命中 -> 等 agent 说完
                                         #  先确保人形再导航去该迎宾点，到达变
                                         #  四足收摄像头、播就位语；格式 "名称关键词|语料"
      - "迎宾|整装待发，即刻就位"        # 2026-10-19 现场需求：点位部分写
                                         #  名称关键词「迎宾」，在映射表 name
                                         #  中子串匹配取 code（如 迎宾点->Y），
                                         #  App 换迎宾点 code 改表即生效；写
                                         #  code（如 Y）也兼容（精确解析优先）
    agent_monitor.send_off_phrases:      # agent 话术命中 -> 等 agent 说完
                                         #  先确保人形再导航去该迎宾点送顾客
                                         #  （途中播报用普通安抚池「请跟紧我」）
                                         #  到达变四足收摄像头、播感谢语
                                         #  send_off_done_text；格式同上
                                         #  2026-10-21 现场需求
      - "迎宾|热情相送，宾至如归"
    agent_monitor.qr_phrases:            # agent 话术命中任一条 -> 显示二维码2分钟（空=关闭）
      - "收到，这就给您显示二维码，您可以扫描二维码留下您的个人信息哦"
    agent_monitor.qr_cancel_phrases:     # agent 话术命中任一条 -> 取消二维码显示（空=关闭；
                                         #  2026-10-17 现场需求：显示/取消是两个互斥业务，
                                         #  各占 qr_business_timeout_seconds 窗口）
      - "好的，这就取消二维码显示"
    agent_monitor.relocate_phrases:      # agent 话术命中 -> 等agent说完该句再在该航点重定位；格式 "航点名|语料"
      - "A|好的，这就在A点开始重定位"   # 航点名 = t1_slam_nav_ws 航点文件点位名
      - "B|好的，这就在B点开始重定位"
      - "C|好的，这就在C点开始重定位"
      - "D|好的，这就在D点开始重定位"
      - "E|好的，这就在E点开始重定位"
      - "F|好的，这就在F点开始重定位"
      - "G|好的，这就在G点开始重定位"
      - "H|好的，这就在H点开始重定位"
      - "I|好的，这就在I点开始重定位"
      - "J|好的，这就在J点开始重定位"
      - "K|好的，这就在K点开始重定位"
      - "Y|好的，这就在Y点开始重定位"
    # 静态导航语料（兜底；动态生成开启时无需配置）。格式 "点位名|语料"；
    # 2026-10-19 现场需求：导航语料默认由点位映射表动态生成（见下方
    # navigate_phrase_template——点位设置下发后除迎宾点外每个点位自动
    # 生成匹配语料，语料随表走，改点位即生效）；静态表仅在点位表从未
    # 下发时兜底或联调手写触发用（要配置时按下方 relocate_phrases 的
    # 条目格式追加 "点位名|语料" 即可）；匹配时忽略空格/标点/大小写差异。
    # 注意：此处不写空列表条目（Humble 的 rcl yaml 解析器不支持 `: []`
    # 空序列参数值，会导致节点启动崩溃），留空 = 代码默认空列表
    # 导航语料动态生成模板（2026-10-19 现场需求）：{point} 替换点位映射表
    # name（显示名，如「比亚迪ætəʊ 1」-> 语料「要去看比亚迪ætəʊ 1，
    # 没问题」）；迎宾点（welcome_point_code）不生成。空串 = 关闭动态
    # 生成，回退 navigate_phrases 静态配置
    agent_monitor.navigate_phrase_template: "要去看{point}，没问题"
    agent_monitor.navigate_stop_phrases: # agent 话术命中任一条 -> 停止导航（等价 navigate.stop；空=关闭）
      - "好的，马上停止导航"             # 2026-10-18 现场需求：语音要求停止导航时
                                         #  agent 应答此话术，命中即停（立即触发不等
                                         #  播报结束，取消要快）
    motion_preset_ids: [2004, 2005, 2006, 2007, 2008, 2009]
                                         # 播报伴随动作池（2004~2009=T1
                                         #  说话动作1~6；2026-10-18 现场
                                         #  需求：讲解动作幅度加大，由
                                         #  2003（双手说话动作，幅度小）
                                         #  改用 T1 说话动作族轮换；
                                         #  现场看效果可删减或固定某一个，
                                         #  原始范围 1001=右手挥手已弃用）
    # 唤醒抑制尾部宽限校准（tail = lead + 每字ms×字数×scale；播报中被
    # 唤醒则调大 scale / tts_speech_ms_per_char）
    tts_speech_ms_per_char: 220
    # scale=1.0 不缩水：0.8 会使抑制早于语音结束 1~3s 解除，
    # 尾部裸奔窗口内唤醒词直接强打断 TTS（2026-10-16 真机日志验证）
    suppress_tail_scale: 1.0
    suppress_tail_flush_ms: 1            # 宽限到期收尾 TTL；1=立即解除
    mic_mute_enabled: true               # 播报期间 SSH 静音运控板麦克风
                                         # （防旧对话轮 request_stop 强打断，
                                         #   2026-10-16；复用 display_remote_*）
